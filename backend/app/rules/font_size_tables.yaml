# Second Schedule of Legal Metrology (Packaged Commodities) Rules, 2011
# Minimum height of numerals and letters for declarations

# Table 1: Minimum height of letters and numerals based on Net Quantity Slabs (in mm)
net_quantity_slabs:
  - min_val: 0.0
    max_val: 50.0
    unit_category: "weight_or_volume" # g or ml
    min_height_normal_mm: 1.0
    min_height_blown_moulded_mm: 1.5
    description: "Up to 50g or 50ml"

  - min_val: 50.0
    max_val: 100.0
    unit_category: "weight_or_volume"
    min_height_normal_mm: 1.5
    min_height_blown_moulded_mm: 2.0
    description: "Above 50g/ml to 100g/ml"

  - min_val: 100.0
    max_val: 200.0
    unit_category: "weight_or_volume"
    min_height_normal_mm: 2.0
    min_height_blown_moulded_mm: 3.0
    description: "Above 100g/ml to 200g/ml"

  - min_val: 200.0
    max_val: 500.0
    unit_category: "weight_or_volume"
    min_height_normal_mm: 3.0
    min_height_blown_moulded_mm: 4.0
    description: "Above 200g/ml to 500g/ml"

  - min_val: 500.0
    max_val: 1000.0 # 1kg / 1L
    unit_category: "weight_or_volume"
    min_height_normal_mm: 4.0
    min_height_blown_moulded_mm: 6.0
    description: "Above 500g/ml to 1kg/1L"

  - min_val: 1000.0
    max_val: 5000.0 # 5kg / 5L
    unit_category: "weight_or_volume"
    min_height_normal_mm: 6.0
    min_height_blown_moulded_mm: 8.0
    description: "Above 1kg/L to 5kg/5L"

  - min_val: 5000.0
    max_val: 9999999.0
    unit_category: "weight_or_volume"
    min_height_normal_mm: 8.0
    min_height_blown_moulded_mm: 10.0
    description: "Above 5kg/5L"

# Table 2: Minimum height based on Area of Principal Display Panel (PDP) in sq cm
pdp_area_slabs:
  - min_area_sq_cm: 0.0
    max_area_sq_cm: 50.0
    min_height_normal_mm: 1.0
    min_height_blown_moulded_mm: 1.5
    description: "PDP Area <= 50 cm²"

  - min_area_sq_cm: 50.0
    max_area_sq_cm: 100.0
    min_height_normal_mm: 1.5
    min_height_blown_moulded_mm: 2.0
    description: "PDP Area 50 to 100 cm²"

  - min_area_sq_cm: 100.0
    max_area_sq_cm: 500.0
    min_height_normal_mm: 2.5
    min_height_blown_moulded_mm: 3.5
    description: "PDP Area 100 to 500 cm²"

  - min_area_sq_cm: 500.0
    max_area_sq_cm: 2500.0
    min_height_normal_mm: 4.0
    min_height_blown_moulded_mm: 6.0
    description: "PDP Area 500 to 2500 cm²"

  - min_area_sq_cm: 2500.0
    max_area_sq_cm: 999999.0
    min_height_normal_mm: 6.0
    min_height_blown_moulded_mm: 8.0
    description: "PDP Area > 2500 cm²"
