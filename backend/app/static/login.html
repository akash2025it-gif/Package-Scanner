<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>PackCheck - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline-variant": "#c3c6d8",
                        "error": "#ba1a1a",
                        "surface-bright": "#f8f9ff",
                        "on-surface": "#181c21",
                        "primary": "#0051d5",
                        "secondary-container": "#65fade",
                        "surface-dim": "#d8dae1",
                        "background": "#f6f8ff",
                        "tertiary-container": "#cd4729",
                        "tertiary": "#aa2f13",
                        "on-tertiary": "#ffffff",
                        "surface": "#ffffff",
                        "surface-container-low": "#f1f3fa",
                        "on-surface-variant": "#424655"
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1.25rem", "full": "9999px" },
                    spacing: { "xs": "4px", "sm": "12px", "base": "8px", "md": "24px", "lg": "40px", "xl": "64px" }
                }
            }
        }
    </script>
    <style>
        .bg-gradient-tech { background: linear-gradient(135deg, #0051d5 0%, #006b5c 100%); }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body class="bg-background min-h-screen font-['Inter'] text-on-surface antialiased flex flex-col md:flex-row">
    <!-- Left Hero Section -->
    <div class="bg-gradient-tech w-full md:w-1/2 p-6 sm:p-8 md:p-12 flex flex-col justify-center items-center text-center relative overflow-hidden shrink-0 rounded-b-3xl md:rounded-r-3xl md:rounded-bl-none shadow-xl z-10">
        <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 20px 20px;"></div>
        <div class="relative z-20 flex flex-col items-center text-center max-w-sm text-white">
            <div class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 bg-white/10 rounded-2xl flex items-center justify-center mb-4 sm:mb-6 backdrop-blur-md border border-white/20">
                <span class="material-symbols-outlined text-4xl sm:text-5xl text-secondary-container">verified_user</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold font-['Hanken_Grotesk'] mb-2">PackCheck</h1>
            <p class="text-lg sm:text-xl text-[#65fade] font-semibold mb-4 sm:mb-6">Scan. Verify. Comply.</p>
            <p class="text-xs sm:text-sm opacity-80 leading-relaxed max-w-xs sm:max-w-sm">AI-Powered Legal Metrology (Packaged Commodities) Compliance Scanner for Enforcement Officers.</p>
            
            <div class="mt-6 sm:mt-8 flex flex-wrap justify-center gap-2 sm:gap-3">
                <a href="/docs" target="_blank" class="px-3.5 py-1.5 sm:px-4 sm:py-2 bg-white/20 hover:bg-white/30 text-white rounded-full text-xs font-semibold backdrop-blur-sm transition-all flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">api</span> Swagger Docs
                </a>
                <a href="/api/v1/health" target="_blank" class="px-3.5 py-1.5 sm:px-4 sm:py-2 bg-white/20 hover:bg-white/30 text-white rounded-full text-xs font-semibold backdrop-blur-sm transition-all flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">health_and_safety</span> API Health
                </a>
            </div>
        </div>
    </div>

    <!-- Right Login Section -->
    <div class="w-full md:w-1/2 p-4 sm:p-8 md:p-12 flex items-center justify-center min-h-0 flex-1 overflow-y-auto">
        <div class="w-full max-w-md bg-surface p-5 sm:p-8 rounded-2xl shadow-lg border border-gray-100 my-auto">
            <div class="mb-6">
                <h2 class="text-2xl font-bold font-['Hanken_Grotesk'] text-on-surface mb-1">Welcome Back</h2>
                <p class="text-sm text-on-surface-variant">Sign in to your legal compliance enforcement portal.</p>
            </div>

            <!-- Quick Demo Accounts -->
            <div class="mb-6 bg-blue-50/60 p-4 rounded-xl border border-blue-100">
                <label class="block text-xs font-bold text-primary uppercase tracking-wider mb-2">Quick 1-Click Demo Login:</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="quickLogin('inspector.sharma@packcheck.gov.in', 'inspector123')" type="button" class="px-3 py-2 bg-white hover:bg-blue-100 border border-blue-200 rounded-lg text-xs font-semibold text-blue-800 text-left flex items-center gap-1.5 transition-colors">
                        <span class="material-symbols-outlined text-sm text-blue-600">badge</span> Inspector (Delhi)
                    </button>
                    <button onclick="quickLogin('admin@packcheck.gov.in', 'admin123')" type="button" class="px-3 py-2 bg-white hover:bg-blue-100 border border-blue-200 rounded-lg text-xs font-semibold text-blue-800 text-left flex items-center gap-1.5 transition-colors">
                        <span class="material-symbols-outlined text-sm text-purple-600">shield_person</span> Admin
                    </button>
                </div>
            </div>

            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                <div id="errorAlert" class="hidden p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg font-medium"></div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1" for="email">Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">mail</span>
                        <input id="email" value="inspector.sharma@packcheck.gov.in" required class="w-full h-12 pl-10 pr-4 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none text-sm" placeholder="officer@packcheck.gov.in" type="email"/>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1" for="password">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">lock</span>
                        <input id="password" value="inspector123" required class="w-full h-12 pl-10 pr-4 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none text-sm" placeholder="••••••••" type="password"/>
                    </div>
                </div>

                <button id="loginBtn" class="w-full h-12 bg-tertiary-container hover:bg-tertiary text-white font-semibold rounded-full shadow-md active:scale-95 transition-all flex items-center justify-center gap-2 text-sm mt-4" type="submit">
                    <span>Login to PackCheck</span>
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
                </button>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        async function quickLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('errorAlert');
            errBox.classList.add('hidden');
            btn.innerHTML = '<span class="animate-spin inline-block mr-2">⏳</span> Authenticating...';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success && data.data.access_token) {
                    PackCheck.setToken(data.data.access_token);
                    PackCheck.setUser(data.data.user);
                    window.location.href = '/dashboard';
                } else {
                    errBox.textContent = data.error?.message || 'Invalid email or password';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.textContent = 'Failed to connect to backend API: ' + err.message;
                errBox.classList.remove('hidden');
            } finally {
                btn.innerHTML = '<span>Login to PackCheck</span><span class="material-symbols-outlined text-lg">arrow_forward</span>';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
