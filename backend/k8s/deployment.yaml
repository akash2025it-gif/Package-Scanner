apiVersion: apps/v1
kind: Deployment
metadata:
  name: packcheck-api
  namespace: default
  labels:
    app: packcheck-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: packcheck-api
  template:
    metadata:
      labels:
        app: packcheck-api
    spec:
      containers:
        - name: api
          image: packcheck-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: packcheck-config
            - secretRef:
                name: packcheck-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: packcheck-worker
  namespace: default
  labels:
    app: packcheck-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: packcheck-worker
  template:
    metadata:
      labels:
        app: packcheck-worker
    spec:
      containers:
        - name: worker
          image: packcheck-backend:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: packcheck-config
            - secretRef:
                name: packcheck-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
