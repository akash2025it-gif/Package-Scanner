name: PackCheck CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Pango, WeasyPrint, Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b tesseract-ocr

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          CELERY_TASK_ALWAYS_EAGER: "True"
          OCR_PROVIDER: "mock"
          STORAGE_PROVIDER: "local"
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing
